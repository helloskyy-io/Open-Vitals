# Docker Compose override for DEV environment
# Selected when config.yaml has temporal.deployment_env: dev.
# Defines dev-only services (e.g. Jupyter). Test/prod overrides don't define these, so they never run.

services:
  # Jupyter Lab (dev only): port from config (openvitals.jupyter.port). REPO_ROOT and JUPYTER_PORT set when running compose (Genesis).
  jupyter:
    build:
      context: ../..
      dockerfile: docker/images/jupyter/Dockerfile
    container_name: jupyter
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:${JUPYTER_PORT:-8888}"
    environment:
      - REPO_ROOT=${REPO_ROOT:-}
      - JUPYTER_PORT=${JUPYTER_PORT:-8888}
    volumes:
      - ${REPO_ROOT:?REPO_ROOT must be set (e.g. by Genesis)}:/workspace
    networks:
      - openvitals
    restart: unless-stopped
